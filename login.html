<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitMeal – Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="container nav">
        <a class="brand" href="index.html"><span class="brand-mark">F</span>FitMeal</a>
        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="Lotrinhhoa.html">Lộ trình hóa</a>
            <a href="menu.html">Thực đơn</a>
            <a href="orders.html">Đơn hàng</a>
            <a href="contact.html">Liên hệ</a>
        </nav>
        <div class="nav-actions">
            <a class="icon-btn" href="cart.html" aria-label="Giỏ hàng">🛒</a>
            <a class="secondary" href="login.html">Đăng nhập</a>
        </div>
    </div>
</header>

<main class="container auth-wrap">
    <section class="auth-card">
        <h1>Chào mừng trở lại 👋</h1>
        <p class="sub">Đăng nhập để quản lý đơn hàng và thông tin tài khoản của bạn.</p>

        <form onsubmit="login(event)">
            <div class="field">
                <label>Email hoặc số điện thoại</label>
                <input id="user" required placeholder="you@example.com hoặc SĐT">
            </div>
            <div class="field" style="margin-top:15px">
                <label>Mật khẩu</label>
                <input id="pass" required type="password" placeholder="••••••••">
            </div>
            <div class="auth-options">
                <label><input type="checkbox" id="remember"> Ghi nhớ đăng nhập</label>
                <a class="link" href="#" onclick="forgotPassword(event)">Quên mật khẩu?</a>
            </div>
            <button class="primary full" type="submit">Đăng nhập</button>
        </form>

     
        </p>

        <p style="text-align:center;color:#6b7280;font-size:14px;margin:12px 0 0">
            Chưa có tài khoản? <a class="link" href="register.html">Đăng ký ngay</a>
        </p>
    </section>
</main>

<footer class="footer">
    <div class="container footer-row">
        <strong>FitMeal</strong>
        <small>Nền tảng đặt món trực tuyến thuận tiện, nhanh chóng.</small>
    </div>
</footer>

<script>
function login(e) {
    e.preventDefault();
    const user = document.getElementById("user").value.trim().toLowerCase();
    const pass = document.getElementById("pass").value;

    // Kiểm tra Admin cứng
    if (user === "admin@foodonline.vn" && pass === "admin123") {
        const adminUser = {
            id: "ADMIN_ROOT",
            role: "admin",
            fullname: "Chủ website (Admin)",
            email: "admin@foodonline.vn",
            phone: "",
            loginAt: new Date().toISOString()
        };
        localStorage.setItem("foodjourney_currentUser", JSON.stringify(adminUser));
        localStorage.setItem("foodjourney_role", "admin");
        window.location.href = "admin.html";
        return;
    }

    const accounts = JSON.parse(localStorage.getItem("foodjourney_accounts")) || [];
    const account = accounts.find(a => (a.email.toLowerCase() === user || a.phone === user) && a.password === pass);

    if (!account) {
        alert("❌ Email/số điện thoại hoặc mật khẩu không đúng!");
        return;
    }

    const currentUser = {
        id: account.id,
        fullname: account.fullname,
        email: account.email,
        phone: account.phone,
        role: "customer",
        loginAt: new Date().toISOString()
    };

    localStorage.setItem("foodjourney_currentUser", JSON.stringify(currentUser));
    localStorage.setItem("foodjourney_role", "customer");

    alert("🎉 Đăng nhập thành công!\n\nXin chào " + account.fullname + "!");
    window.location.href = "orders.html"; // Chuyển thẳng về trang quản lý đơn hàng của user
}

function forgotPassword(e) {
    e.preventDefault();
    alert("Chức năng quên mật khẩu sẽ được hỗ trợ trong phiên bản tới.");
}
</script>
</body>
</html>
